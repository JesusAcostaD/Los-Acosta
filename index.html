<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Árbol Genealógico — Antonio Felipe Acosta Rodriguez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2b22;
    --paper:#f0ead9;
    --forest:#1f4033;
    --forest-deep:#12281f;
    --gold:#b8923f;
    --gold-soft:#e3cd8f;
    --line:#c9bd9a;
    --card:#ffffff;
    --muted:#5b6b60;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(31,64,51,0.06), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(184,146,63,0.10), transparent 45%);
    color:var(--ink);
    font-family:'Source Serif 4', serif;
    line-height:1.5;
  }
  h1,h2,h3, .display{
    font-family:'Fraunces', serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .mono{font-family:'JetBrains Mono', monospace; letter-spacing:0.02em;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    background:linear-gradient(180deg, var(--forest-deep) 0%, var(--forest) 100%);
    color:var(--paper);
    padding:5rem 1.5rem 6rem;
    overflow:hidden;
    text-align:center;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(90deg, rgba(227,205,143,0.05) 0px, rgba(227,205,143,0.05) 1px, transparent 1px, transparent 64px);
    pointer-events:none;
  }
  .hero .eyebrow{
    font-family:'JetBrains Mono', monospace;
    text-transform:uppercase;
    letter-spacing:0.25em;
    font-size:0.7rem;
    color:var(--gold-soft);
    margin-bottom:1.2rem;
  }
  .hero h1{
    font-size:clamp(2.2rem, 5vw, 3.8rem);
    margin:0 0 0.6rem;
    font-style:italic;
  }
  .hero p.sub{
    color:#cfd9cf;
    max-width:560px;
    margin:0 auto;
    font-size:1.05rem;
  }
  .rings{
    display:flex; justify-content:center; gap:0.6rem; margin-top:2.6rem; flex-wrap:wrap;
  }
  .ring{
    display:flex; flex-direction:column; align-items:center;
    padding:0.7rem 1.1rem;
    border:1px solid rgba(227,205,143,0.35);
    border-radius:999px;
    background:rgba(255,255,255,0.03);
    min-width:88px;
  }
  .ring .n{font-family:'Fraunces',serif; font-size:1.4rem; color:var(--gold-soft);}
  .ring .l{font-family:'JetBrains Mono',monospace; font-size:0.62rem; text-transform:uppercase; letter-spacing:0.08em; color:#a9b8ac; margin-top:0.2rem;}

  /* ---------- NAV / SEARCH ---------- */
  .toolbar{
    position:sticky; top:0; z-index:10;
    background:rgba(240,234,217,0.94);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:0.9rem 1.5rem;
    display:flex; gap:0.8rem; flex-wrap:wrap; align-items:center;
    justify-content:center;
  }
  .toolbar input[type="text"]{
    font-family:'Source Serif 4', serif;
    font-size:0.95rem;
    padding:0.55rem 0.9rem;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--card);
    min-width:220px;
    color:var(--ink);
  }
  .toolbar input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .chip{
    font-family:'JetBrains Mono',monospace;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    padding:0.45rem 0.85rem;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--card);
    cursor:pointer;
    color:var(--muted);
    transition:all .15s ease;
  }
  .chip.active, .chip:hover{
    background:var(--forest);
    color:var(--gold-soft);
    border-color:var(--forest);
  }

  /* ---------- SECTIONS ---------- */
  main{max-width:1100px; margin:0 auto; padding:3rem 1.5rem 5rem;}
  .gen{margin-bottom:3.2rem;}
  .gen-head{
    display:flex; align-items:baseline; gap:0.9rem;
    border-bottom:2px solid var(--forest);
    padding-bottom:0.6rem;
    margin-bottom:1.3rem;
  }
  .gen-head .num{
    font-family:'Fraunces',serif; font-style:italic; font-size:2.2rem;
    color:var(--gold); line-height:1;
  }
  .gen-head h2{font-size:1.4rem; margin:0;}
  .gen-head .count{
    margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:0.78rem; color:var(--muted);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:0.85rem;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--forest);
    border-radius:6px;
    padding:0.85rem 1rem;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{ transform:translateY(-2px); box-shadow:0 6px 16px rgba(31,64,51,0.12); }
  .card .name{font-weight:600; font-size:1rem; margin-bottom:0.25rem;}
  .card .rel{font-size:0.85rem; color:var(--muted); font-style:italic;}
  .card[data-cat="child"]{border-left-color:#1f4033;}
  .card[data-cat="grandchild"]{border-left-color:#5c7a63;}
  .card[data-cat="greatgrandchild"]{border-left-color:#9db38f;}
  .card[data-cat="spouse"]{border-left-color:#b8923f;}
  .card[data-cat="exspouse"]{border-left-color:#c9a86a;}
  .card[data-cat="inlaw"]{border-left-color:#8c6d46;}
  .card[data-cat="parent"], .card[data-cat="sibling"]{border-left-color:#3d5945;}
  .card[data-cat="other"]{border-left-color:#a89c78;}

  .hidden{display:none !important;}

  footer{
    text-align:center; padding:2.5rem 1rem 3rem; color:var(--muted); font-size:0.85rem;
    font-family:'JetBrains Mono', monospace;
  }
  .empty-msg{
    text-align:center; color:var(--muted); padding:2rem; font-style:italic; display:none;
  }
  @media (max-width:600px){
    .ring{min-width:70px; padding:0.5rem 0.7rem;}
  }
</style>
</head>

<section class="hero">
  <div class="eyebrow">Registro genealógico &middot; Familia Acosta</div>
  <h1>Antonio Felipe Acosta Rodriguez</h1>

  <div class="rings" id="ringSummary"></div>
</section>

<div class="toolbar">
  <input type="text" id="searchBox" placeholder="Buscar por nombre o parentesco…">
  <button class="chip active" data-filter="all">Todos</button>

  <button class="chip" data-filter="inlaw">Familia política</button>

</div>

<main id="main"></main>

const GEN_LABELS = {
  0:"El tronco", 1:"Padres, hermano, esposas e hijos", 2:"Nietos y su generación",
  3:"Bisnietos y su generación", 4:"Familia extendida — 4 pasos",
  5:"Familia extendida — 5 pasos", 6:"Familia extendida — 6 pasos"
};

function render(){
  const main = document.getElementById('main');
  main.innerHTML = "";
  const bySteps = {};
  DATA.forEach(p=>{ (bySteps[p.s] = bySteps[p.s]||[]).push(p); });

  Object.keys(bySteps).sort((a,b)=>a-b).forEach(step=>{
    const people = bySteps[step];
    const section = document.createElement('div');
    section.className = 'gen';
    section.dataset.step = step;
    section.innerHTML = `
      <div class="gen-head">
        <span class="num mono">${String(step).padStart(2,'0')}</span>
        <h2>${GEN_LABELS[step] || ('Grado '+step)}</h2>
        <span class="count mono">${people.length} personas</span>
      </div>
      <div class="grid"></div>
    `;
    const grid = section.querySelector('.grid');
    people.forEach(p=>{
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.cat = p.c;
      card.dataset.search = (p.n + ' ' + p.r).toLowerCase();
      card.innerHTML = `<div class="name">${p.n}</div><div class="rel">${p.r}</div>`;
      grid.appendChild(card);
    });
    main.appendChild(section);
  });

  // ring summary in hero
  const ring = document.getElementById('ringSummary');
  ring.innerHTML = "";
  Object.keys(bySteps).sort((a,b)=>a-b).forEach(step=>{
    const div = document.createElement('div');
    div.className = 'ring';
    div.innerHTML = `<span class="n">${bySteps[step].length}</span><span class="l mono">paso ${step}</span>`;
    ring.appendChild(div);
  });
}
render();

let activeFilter = 'all';
let query = '';

function applyFilters(){
  document.querySelectorAll('.card').forEach(card=>{
    const matchesFilter = activeFilter === 'all' || card.dataset.cat === activeFilter;
    const matchesQuery = !query || card.dataset.search.includes(query);
    card.classList.toggle('hidden', !(matchesFilter && matchesQuery));
  });
  document.querySelectorAll('.gen').forEach(sec=>{
    const visible = sec.querySelectorAll('.card:not(.hidden)').length;
    sec.classList.toggle('hidden', visible === 0);
  });
}

document.querySelectorAll('.chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = chip.dataset.filter;
    applyFilters();
  });
});

document.getElementById('searchBox').addEventListener('input', (e)=>{
  query = e.target.value.trim().toLowerCase();
  applyFilters();
});
</script>
